name: CI/CD
on: [push]
permissions:
  contents: write
  actions: write
env:
  NODE_ENV: ${{ vars.NODE_ENV }}
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    environment:
      deployment: false
      name: |
        ${{ case(
          github.ref_name == 'prod', 'prod',
          github.ref_name == 'staging', 'staging',
          'dev'
        ) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Install Rokit dependencies
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Lint
        run: |
          npx orchestra run lint -- -y

  build:
    name: Build
    runs-on: ubuntu-latest
    environment:
      deployment: false
      name: |
        ${{ case(
          github.ref_name == 'prod', 'prod',
          github.ref_name == 'staging', 'staging',
          'dev'
        ) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Install Rokit dependencies
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Build
        run: |
          npx orchestra run build -- -y

      - name: Upload place files to artifact registry
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/	

      - name: Upload place files to GitHub releases
        if: ${{ github.ref_name == 'prod' || github.ref_name == 'staging'  }}
        run: |
          npx orchestra run upload -- -s

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref_name == 'prod' || github.ref_name == 'staging'  }}
    environment:
      name: |
        ${{ case(
          github.ref_name == 'prod', 'prod',
          github.ref_name == 'staging', 'staging',
          'dev'
        ) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Install Rokit dependencies
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Download place files from artifact registry
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to Roblox
        run: |
          npx orchestra run publish -- -s
        env:
          OC_API_KEY: ${{ secrets.OC_API_KEY }}
