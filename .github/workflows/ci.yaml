name: Lint & Build

on:
  push:
    branches:
    - prod
    - staging
  pull_request:
    branches:
    - prod
    - staging

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Rokit dependencies
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install NPM dependencies
        run: npm ci

      - name: Lint
        run: |
          npx orchestra run lint -- -y
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Rokit dependencies
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install NPM dependencies
        run: npm ci

      - name: Build
        run: |
          npx orchestra run build -- -y
